id: file-management
name: Windows file management
description: Navigate files and folders through visible File Explorer interactions.
keywords:
  - 文件资源管理器
  - 资源管理器
  - 文件夹
  - 文件
  - explorer
  - folder
applications:
  - explorer.exe
  - 文件资源管理器
  - file explorer
instructions:
  - Activate or visibly launch File Explorer through the Windows UI.
  - Verify the current folder path and selected item before modifying anything.
  - Re-observe after navigation, rename, move, copy, or dialog actions.
  - Treat deletion, overwrite, move, and permission changes as sensitive.
success_criteria:
  - The requested folder or file state is visible in File Explorer.
avoid:
  - Do not infer a file identity from a truncated name when similar items exist.
  - Do not confirm destructive dialogs without user approval.
priority: 0

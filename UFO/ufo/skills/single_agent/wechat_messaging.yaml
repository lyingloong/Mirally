id: wechat-messaging
name: WeChat messaging
description: Navigate to the intended WeChat conversation and send a message safely.
keywords:
  - 微信
  - wechat
  - 发消息
  - 发送消息
  - 联系人
applications:
  - wechat.exe
  - 微信
  - wechat
instructions:
  - Activate or visibly launch WeChat through the Windows UI.
  - Use WeChat search to locate the named contact instead of typing into the current chat.
  - Open the result and verify the conversation title before entering message text.
  - Treat the final send action as sensitive and require confirmation when safe guard is enabled.
success_criteria:
  - The intended conversation title is visible.
  - The sent text is visibly present in that conversation.
avoid:
  - Do not type message text until the intended conversation has been verified.
  - Do not infer a contact from the currently open conversation.
priority: 10

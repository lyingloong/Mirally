<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mirally</title>
  <style>
    :root { color-scheme:light dark; --bg:#f7f9fc; --ink:#192b3a; --muted:#627387; --blue:#0878b2; --surface:#ffffffc9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
    main { min-height:100vh; display:grid; place-items:center; position:relative; isolation:isolate; }
    .aurora { position:absolute; width:min(860px,90vw); aspect-ratio:1.5; z-index:-2; background:radial-gradient(ellipse at 30% 40%,#1cb8ff23,transparent 58%),radial-gradient(ellipse at 70% 50%,#5acfee20,transparent 60%); animation:aurora 12s ease-in-out infinite; }
    .grid { position:absolute; inset:0; z-index:-3; background-image:linear-gradient(#7fafd40b 1px,transparent 1px),linear-gradient(90deg,#7fafd40b 1px,transparent 1px); background-size:72px 72px; mask-image:radial-gradient(ellipse,black,transparent 65%); }
    .beam { position:absolute; z-index:-1; width:min(1040px,110vw); height:380px; border-radius:50%; border:1px solid #2ca6ec1e; transform:rotate(-18deg); }
    .beam::after { content:""; position:absolute; inset:-1px; border-radius:inherit; border:1px solid #57baff; mask-image:linear-gradient(90deg,transparent,#000 20%,transparent 50%); opacity:.5; animation:beam 7s ease-in-out infinite; }
    .beam.two { transform:rotate(18deg); width:min(900px,105vw); height:400px; }
    .beam.two::after { animation-delay:-3.5s; mask-image:linear-gradient(270deg,transparent,#000 20%,transparent 50%); }
    .center { text-align:center; position:relative; width:min(620px,88vw); padding:30px 0; }
    .eyebrow { font-size:10px; font-weight:600; letter-spacing:5px; color:var(--blue); margin:0 0 28px; opacity:.6; animation:enter 1s .5s both; }
    .mark { width:290px; height:260px; margin:0 auto 20px; display:grid; place-items:center; position:relative; perspective:800px; }
    .halo { position:absolute; width:230px; height:230px; border-radius:50%; background:radial-gradient(circle,#20b8ff1a,transparent 70%); animation:halo 6s ease-in-out infinite; }
    .orbit { position:absolute; width:280px; height:280px; border-radius:50%; border:1px solid #28a5e826; transform:rotateX(62deg) rotateZ(-26deg); }
    .orbit::after { content:""; position:absolute; width:7px; height:7px; top:37px; left:37px; border-radius:50%; background:#49beff; box-shadow:0 0 18px #49beffa6; }
    .orbit.a { animation:orbit-a 9s linear infinite; }
    .orbit.b { width:255px; height:255px; border-color:#4fc9ec42; animation:orbit-b 13s linear infinite; }
    .orbit.b::after { background:#83d9ff; width:4px; height:4px; box-shadow:0 0 16px #28c2ffc9; }
    .embrace { position:absolute; width:200px; height:200px; border-radius:50%; background:conic-gradient(from 0deg,transparent 5%,#37b5ff65 18%,#41c9f8 24%,transparent 29%,transparent 55%,#0b9bf175 68%,#40bcff 74%,transparent 79%); mask:radial-gradient(circle,transparent 66%,#000 67%,#000 69%,transparent 70%); animation:embrace 7s ease-in-out infinite; }
    .logo { width:168px; height:168px; filter:drop-shadow(0 16px 28px #098ce534); animation:logo-in 1.7s cubic-bezier(.16,1,.3,1) both, breathe 6s 1.7s ease-in-out infinite; }
    .spark { position:absolute; width:3px; height:3px; border-radius:50%; background:#29acfa; box-shadow:0 0 9px #48bcff70; opacity:0; animation:spark 6s var(--delay) ease-in-out infinite; left:var(--x); top:var(--y); }
    h1 { font-size:58px; font-weight:600; letter-spacing:-2.6px; line-height:1.1; margin:0 0 21px; animation:enter 1.2s .35s both; }
    .tagline { margin:0; font-size:18px; color:var(--muted); letter-spacing:3px; animation:enter 1.2s .7s both; }
    .loading { margin:36px auto 0; width:128px; height:2px; overflow:hidden; background:#8bbbd329; border-radius:9px; animation:enter .8s 1s both; }
    .loading::after { content:""; display:block; width:55%; height:100%; background:linear-gradient(90deg,transparent,#159fea,transparent); animation:loading 2.2s ease-in-out infinite; }
    .status { margin:15px auto 0; color:var(--muted); font-size:11px; letter-spacing:.6px; min-height:18px; opacity:.8; animation:enter .8s 1.1s both; }
    .error { display:none; margin:20px auto 0; padding:16px 22px; border:1px solid #82b6d936; border-radius:16px; background:var(--surface); text-align:left; font-size:13px; line-height:1.8; max-width:480px; overflow-wrap:anywhere; }
    .error p { margin:0 0 8px; }
    .error details { color:var(--muted); font-size:11px; }
    .error summary { cursor:pointer; }
    #diagnostic { white-space:pre-wrap; font-family:inherit; margin:8px 0 0; }
    footer { position:absolute; bottom:30px; left:0; right:0; text-align:center; color:var(--muted); font-size:9px; letter-spacing:3px; opacity:.6; }
    @keyframes enter { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes logo-in { from { opacity:0; transform:scale(.62) translateY(20px); filter:blur(12px) drop-shadow(0 16px 28px #098ce534); } to { opacity:1; transform:scale(1); } }
    @keyframes breathe { 50% { transform:translateY(-7px); } }
    @keyframes orbit-a { to { transform:rotateX(62deg) rotateZ(334deg); } }
    @keyframes orbit-b { from { transform:rotateY(58deg) rotateZ(30deg); } to { transform:rotateY(58deg) rotateZ(-330deg); } }
    @keyframes embrace { 0%,100% { transform:rotate(-35deg) scale(.88); opacity:.4; } 50% { transform:rotate(145deg) scale(1.15); opacity:.8; } }
    @keyframes halo { 50% { transform:scale(1.3); opacity:.6; } }
    @keyframes aurora { 50% { transform:translateY(-18px) rotate(8deg) scale(1.08); opacity:.7; } }
    @keyframes beam { 50% { transform:rotate(180deg); opacity:.25; } }
    @keyframes spark { 15% { opacity:.55; } 75% { opacity:.4; } to { opacity:0; transform:translateY(-35px); } }
    @keyframes loading { from { transform:translateX(-110%); } to { transform:translateX(285%); } }
    @media (prefers-color-scheme:dark) { :root { --bg:#111923; --ink:#edf6ff; --muted:#8fa6bc; --blue:#62c5fa; --surface:#172433dc; } .aurora { opacity:.8; } .beam { border-color:#49a7db24; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; } .spark { opacity:.3; } }
    @media (max-height:650px) { .eyebrow { margin-bottom:8px; } .mark { width:250px; height:200px; margin-bottom:14px; } .logo { width:135px; height:135px; } .orbit { width:225px; height:225px; } .orbit.b { width:200px; height:200px; } h1 { font-size:44px; margin-bottom:14px; } .tagline { font-size:15px; } .loading { margin-top:24px; } footer { bottom:16px; } }
    @media (max-height:490px) { .eyebrow { display:none; } .mark { height:155px; } .logo { width:110px; height:110px; } .orbit { width:180px; height:180px; } .orbit.b { width:155px; height:155px; } .embrace { width:155px; height:155px; } h1 { font-size:34px; } .loading { margin-top:16px; } footer { display:none; } .center { padding:12px 0; } }
  </style>
</head>
<body>
  <main><div class="grid"></div><div class="aurora"></div><div class="beam"></div><div class="beam two"></div>
    <div class="center"><p class="eyebrow">YOUR EVERYDAY ALLY</p>
      <div class="mark"><div class="halo"></div><div class="orbit a"></div><div class="orbit b"></div><div class="embrace"></div>
        <span class="spark" style="--x:9%;--y:57%;--delay:-1s"></span><span class="spark" style="--x:83%;--y:30%;--delay:-3s"></span>
        <span class="spark" style="--x:27%;--y:12%;--delay:-4s"></span><span class="spark" style="--x:68%;--y:87%;--delay:-2s"></span>
        <span class="spark" style="--x:16%;--y:82%;--delay:-5s"></span><span class="spark" style="--x:92%;--y:67%;--delay:0s"></span>
        <img class="logo" src="data:image/png;base64,__MIRALLY_LOGO__" alt="Mirally 相伴 M">
      </div>
      <h1>Mirally</h1><p class="tagline">与你并肩，让想法向前。</p>
      <div class="loading" aria-hidden="true"></div><div class="status" id="status" role="status">正在唤醒你的工作伙伴</div>
      <div class="error" id="error" role="alert"><p>工作空间暂时未能就绪。请在顶部菜单选择「重新连接」。</p><details><summary>查看诊断提示</summary><pre id="diagnostic"></pre></details></div>
    </div><footer>IDEAS MOVE FORWARD. TOGETHER.</footer></main>
  <script>
    window.setStartupStatus = (message, error=false) => {
      document.getElementById('status').textContent = error ? '工作伙伴暂时无法连接' : message;
      const box = document.getElementById('error');
      document.getElementById('diagnostic').textContent = error ? message : '';
      box.style.display = error ? 'block' : 'none';
      document.querySelector('.loading').style.display = error ? 'none' : 'block';
    };
  </script>
</body>
</html>

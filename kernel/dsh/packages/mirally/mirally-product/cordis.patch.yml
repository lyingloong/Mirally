# Product overlay over @deepseek-ai/dsh-base (not a reduced replacement bundle).
# Keep every inherited capability unless a documented product-owned replacement
# or external-service boundary is stated here. The upstream patch remains the
# source of truth for core sessions, tools, compaction, planning and delegation.

# Mirally owns credentials, route selection, settings, title generation and UI.
# No provider or ambient .env/credential document is silently adopted at launch.
- id: credentials
  disabled: true
- id: authorization
  disabled: true
- id: deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: agent-default-model
  disabled: true
- id: session-title-llm
  disabled: true
- id: settings
  disabled: true
- id: config-editor
  disabled: true
- id: hmr
  disabled: true

# These upstream services have separate identity/network ownership. Product
# launch never uploads logs, captures feedback telemetry or enables a vendor
# package catalog. Ordinary local session persistence and queries remain on.
- id: session-log-deepseek
  disabled: true
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: command-feedback
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web
  config:
    fetchProvider: http
# Anonymous public-HTTP fetching uses the native DSH tool. Search requires an
# explicitly configured provider; it never reads an inherited DEEPSEEK_API_KEY.
- id: tool-web
  config:
    fetch: true
    search: false

- id: attachment-local
  config:
    dshHome: !!js process.env.MIRALLY_HOME
- id: working-directory
  config:
    defaultDirectory: !!js process.env.MIRALLY_WORKSPACE
- id: fs-sandbox
  config:
    cwd: !!js process.env.MIRALLY_WORKSPACE
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.MIRALLY_WORKSPACE
- id: approval
  config:
    policy: ask
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: session-query-sqlite
  config:
    path: !!js dshHomePath('session-query.sqlite3')
    openAt: first-search

# The upstream 65k headroom assumes a very large model. Mirally allows user
# configured routes with smaller windows; native proportional thresholds still
# apply while these bounds leave room for an ordinary 8k/16k model to compact.
- id: compaction-basic
  config:
    headroomTokens: 0
    maxTokens: 2048

# Native discovery stays inside this product home; explicit extension settings
# remain the owner of all additional roots and MCP/plugin adapters.
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js dshHomePath('skills')

- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    personaPrefix: |-
      You are Mirally, a personal agent supporting the user's life and work.
      Use available context with its sources and gaps; do not invent experiences or memories.
      Respect explicit preferences, stopped work and source withdrawal. Take computer actions only when requested or authorized by the user; use available tools and report their real results.
      Use product tools for relevant memories, preferences and explicit reminders. Tool success and actual external effects differ.
      Prefer the native DSH file tools and pwsh/bash for new execution work. Use job_list/job_output/job_kill for their native jobs. The mirally_job_* tools inspect only compatibility jobs started by mirally_run_command; never infer that no work exists from just one of these registries.
- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 1

- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
      config:
        mode: legacy
        timeout: -1
    - id: mirally-product
      name: '@mirally/dsh-product'
      config:
        root: !!js process.env.MIRALLY_ROOT
        home: !!js process.env.MIRALLY_HOME
        python: !!js process.env.MIRALLY_PYTHON
        uiDirectory: !!js process.env.MIRALLY_UI_DIRECTORY
        port: !!js Number(process.env.MIRALLY_PORT ?? 0)
        token: !!js process.env.MIRALLY_AUTH_TOKEN
        testMode: !!js process.env.MIRALLY_TEST_MODE === '1'
    - id: mirally-extensions
      name: '@mirally/dsh-extensions'
      config:
        root: !!js process.env.MIRALLY_ROOT
        home: !!js process.env.MIRALLY_HOME
